<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>test-weigh-in</title>
<style>
body{font:14px system-ui,sans-serif;margin:24px;color:#222;overflow-wrap:break-word}
#gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px;margin:16px 0}
.gauge{grid-row:span 3;display:grid;grid-template-rows:subgrid;row-gap:4px;align-content:start;margin-bottom:12px;border:2px solid #ccc;border-radius:8px;padding:12px;background:#fff;text-align:center;cursor:pointer;font:inherit}
.gauge>*{align-self:start}
.gauge-status{font-size:12px;line-height:1.3}
/* one row of tabs on a rule; it scrolls sideways when the row is wider than the screen */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid #ccc;scrollbar-width:thin}
.tabs>button{flex:none;font:inherit;padding:4px 12px;border:1px solid #ccc;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;background:#f3f4f6;color:#222;cursor:pointer;white-space:nowrap}
.tabs>button[aria-pressed=true]{background:#2563eb;color:#fff;border-bottom-color:#1e40af;font-weight:600}
@media (max-width:600px){.tabs{gap:2px}.tabs>button{padding:4px 7px}}
button:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
#details table{width:100%}
#details tr+tr{border-top:1px solid #e5e7eb}
#details svg{max-width:100%;height:auto}
.gauge[aria-pressed=true]{border-color:#2563eb}
.score{display:block;font-size:32px;font-weight:600}
#banner{background:#fef2f2;color:#991b1b;padding:8px 12px;border-radius:6px;margin-bottom:0}
#failing{border:1px solid #fecaca;border-top:0;border-radius:0 0 6px 6px;padding:4px 12px;margin-bottom:16px}
#failing p{margin:4px 0}
#failing:empty{display:none}
#banner:has(+#failing:not(:empty)){border-radius:6px 6px 0 0}
.flag{display:block;color:#92400e}
table{border-collapse:collapse}td,th{padding:4px 12px;text-align:left}
/* a test identity: breaks after / :: . _ (see ident), anywhere only when one part is wider than the line */
.id{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
/* the anchors column takes the spare width, so a metric and its value stay side by side */
@media (min-width:601px){#details th:nth-child(-n+3),#details td:nth-child(-n+3):not([colspan]){width:1%;white-space:nowrap}}
td:first-child,th:first-child{padding-left:0}
@media (max-width:600px){td,th{padding:4px 6px}td:last-child,th:last-child{padding-right:0}#details td:first-child{min-width:7em}}
</style></head><body>
<h1>test-weigh-in</h1>
<p data-testid="inventory" id="inventory"></p>
<p data-testid="banner" id="banner"></p>
<div data-testid="failing" id="failing"></div>
<div id="gauges"></div>
<section data-testid="details" id="details"></section>
<script>
const data = __DATA__;
const shown = (s) => Math.min(99, Math.max(1, Math.round(s)));
const el = (tag, text, parent) => { const e = document.createElement(tag); e.textContent = text; parent.appendChild(e); return e; };
const fmt = (n) => String(Math.round(n * 100) / 100);
// words that belong together stay on one line: "71.3 %", "target ≤ 60 s"
const nb = (...parts) => parts.filter((x) => x !== '').join('\u00a0');
// a test identity. A line may end after a / :: . or _ that is at least 16 characters past the previous break: the
// identity wraps between its parts rather than mid-word, with few nodes on a page of 200 identities
const ident = (text, parent) => {
  const s = el('span', '', parent); s.className = 'id';
  const add = (t) => { if (s.firstChild) s.appendChild(document.createElement('wbr')); s.appendChild(document.createTextNode(t)); };
  let chunk = '';
  for (const part of text.match(/[^]*?(?:\/|::|\.|_)|[^]+$/g) || []) if ((chunk += part).length >= 16) { add(chunk); chunk = ''; }
  if (chunk) add(chunk);
  return s;
};
// a block naming one test, optionally followed by a note such as "(skipped)" or "(Real sleep, 1.02 s)", whose numbers keep their units
const testLine = (tag, test, parent, note) => { const e = el(tag, '', parent); ident(test, e); if (note) e.append(' ' + note.replace(/(\d) (?=s\b|%)/g, '$1\u00a0')); return e; };
let selected = 0, tab = 'Metrics', picked = null;
const NS = 'http://www.w3.org/2000/svg';
// tests with the same or nearly the same coverage land on or near one place: push apart each pair of dots that
// overlaps until none does, so every dot stays clickable; same data, same pushes, same map on every load.
// Computed once, on first opening: selecting a dot never moves one.
// ponytail: all pairs per pass, quadratic; a spatial grid if maps of thousands of dots get slow
let placed = null;
function place() {
  const dots = data.map.map((d) => ({ d, cx: 20 + d.x * 360, cy: 20 + d.y * 260, r: 4 + Math.min(10, d.runtime * 4) }));
  for (let pass = 0, moved = true; moved && pass < 200; pass++) {
    moved = false;
    dots.forEach((a, i) => dots.slice(i + 1).forEach((b, k) => {
      const dx = b.cx - a.cx, dy = b.cy - a.cy, dist = Math.hypot(dx, dy), gap = a.r + b.r + 2;
      if (dist >= gap) return;
      // dots on one spot part along an angle fixed by their order
      const angle = dist > 1e-9 ? Math.atan2(dy, dx) : 2.39996 * (i + k + 1), push = (gap - dist) / 2 + 0.01;
      a.cx -= push * Math.cos(angle); a.cy -= push * Math.sin(angle);
      b.cx += push * Math.cos(angle); b.cy += push * Math.sin(angle);
      moved = true;
    }));
  }
  // the view grows to hold every ring, at one unit per pixel so sizes keep their meaning
  const x0 = Math.min(0, ...dots.map((o) => o.cx - o.r - 2)), y0 = Math.min(0, ...dots.map((o) => o.cy - o.r - 2));
  const w = Math.max(400, ...dots.map((o) => o.cx + o.r + 2)) - x0, h = Math.max(300, ...dots.map((o) => o.cy + o.r + 2)) - y0;
  return { dots, x0, y0, w, h };
}
function drawMap(parent) {
  const { dots, x0, y0, w, h } = placed || (placed = place());
  const legend = el('p', 'Colour shows unique lines: grey 0, amber 1–3, green 4+. Dot size shows runtime: slower tests are larger. Hover a dot for its test; click it to select.', parent);
  legend.setAttribute('data-testid', 'map-legend');
  const svg = document.createElementNS(NS, 'svg');
  parent.appendChild(svg);
  svg.setAttribute('viewBox', `${x0} ${y0} ${w} ${h}`); svg.setAttribute('width', w); svg.setAttribute('height', h);
  const circles = new Map();
  dots.forEach(({ d, cx, cy, r }) => {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy);
    c.setAttribute('r', r);
    c.setAttribute('fill', d.unique === 0 ? '#9ca3af' : d.unique < 4 ? '#f59e0b' : '#16a34a');
    c.setAttribute('stroke-width', '3');
    c.setAttribute('data-testid', 'map-dot'); c.dataset.test = d.test;
    el('title', d.test, c);
    circles.set(d.test, c);
    c.onclick = () => pick(d);
    svg.appendChild(c);
  });
  const pickedName = el('p', '', parent); pickedName.setAttribute('data-testid', 'map-picked');
  const list = el('div', '', parent); list.setAttribute('data-testid', 'map-similar');
  let lit = [];
  // selection touches only the previous and the new highlights and the neighbour list, never the placement
  const pick = (d) => {
    picked = d;
    lit.forEach((c) => { c.setAttribute('stroke', 'none'); delete c.dataset.highlighted; });
    const sims = d.similar.slice().sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
    lit = [d.test, ...sims.map(([n]) => n)].map((n) => circles.get(n)).filter(Boolean);
    lit.forEach((c) => { c.setAttribute('stroke', '#2563eb'); c.dataset.highlighted = 'true'; });
    pickedName.textContent = 'Selected: ' + d.test;
    list.replaceChildren();
    if (sims.length) el('p', 'Similar tests, Jaccard similarity (1.00 = identical coverage), highest first', list);
    sims.forEach(([n, s]) => el('p', n + ' ' + s.toFixed(2), list).setAttribute('data-testid', 'map-similar-item'));
  };
  if (picked) pick(picked);
}
const PAGE = 100;
// highest similarity first; ties by identities, so the order does not depend on how the pairs arrive
const byIdentity = (o) => o.tests.slice().sort().join('\n');
const ranked = data.overlaps.slice().sort((a, b) => b.jaccard - a.jaccard || (byIdentity(a) < byIdentity(b) ? -1 : byIdentity(a) > byIdentity(b) ? 1 : 0));
let ovQuery = '', ovPage = 0;
function drawOverlaps(parent) {
  const box = el('div', '', parent);
  const input = document.createElement('input');
  input.type = 'search'; input.placeholder = 'Search test identities'; input.value = ovQuery; input.setAttribute('aria-label', 'Search overlapping tests');
  input.setAttribute('data-testid', 'overlap-search');
  box.appendChild(input);
  const out = el('div', '', box);
  const draw = () => {
    out.replaceChildren();
    const q = ovQuery.toLowerCase();
    const hits = q ? ranked.filter((o) => o.tests.some((t) => t.toLowerCase().includes(q))) : ranked;
    const pages = Math.max(1, Math.ceil(hits.length / PAGE));
    ovPage = Math.min(ovPage, pages - 1);
    el('p', hits.length.toLocaleString('en-US') + (hits.length === 1 ? ' pair' : ' pairs'), out).setAttribute('data-testid', 'overlap-count');
    if (!hits.length) el('p', 'No pair matches this search.', out).setAttribute('data-testid', 'overlap-empty');
    // a page is built off the page and attached once: one insertion instead of thousands
    const rows = document.createDocumentFragment();
    hits.slice(ovPage * PAGE, (ovPage + 1) * PAGE).forEach((o) => {
      const row = el('div', '', rows);
      row.setAttribute('data-testid', 'overlap-pair'); row.style.cssText = 'padding:6px 0;border-bottom:1px solid #e5e7eb';
      const label = el('strong', 'Jaccard ' + o.jaccard.toFixed(2), row); label.style.marginRight = '12px';
      o.tests.forEach((t) => testLine('div', t, row).setAttribute('data-testid', 'overlap-test'));
    });
    out.appendChild(rows);
    const nav = el('p', '', out);
    const step = (text, d, id) => { const b = el('button', text, nav); b.setAttribute('data-testid', id); b.disabled = ovPage + d < 0 || ovPage + d >= pages; b.onclick = () => { ovPage += d; draw(); }; };
    step('Previous', -1, 'overlap-prev');
    el('span', ' Page ' + (ovPage + 1) + ' of ' + pages + ' ', nav);
    step('Next', 1, 'overlap-next');
  };
  input.oninput = () => { ovQuery = input.value; ovPage = 0; draw(); };
  draw();
}
function render() {
  document.getElementById('inventory').textContent = data.inventory;
  const banner = document.getElementById('banner');
  if (banner) { if (data.banner) banner.textContent = data.banner; else banner.remove(); }
  const failing = document.getElementById('failing'); failing.replaceChildren();
  data.failing.forEach((n) => testLine('p', n, failing).setAttribute('data-testid', 'failing-test'));
  const gauges = document.getElementById('gauges'), details = document.getElementById('details');
  gauges.replaceChildren(); details.replaceChildren();
  data.pillars.forEach((p, i) => {
    const g = el('button', '', gauges);
    g.className = 'gauge'; g.dataset.testid = 'gauge'; g.setAttribute('data-testid', 'gauge');
    g.setAttribute('aria-pressed', i === selected);
    el('span', p.name, g).setAttribute('data-testid', 'gauge-title');
    el('span', p.score === null ? '–' : shown(p.score), g).className = 'score';
    const status = el('span', p.partial ? 'partial: ' + p.metrics.length + ' of ' + p.total + ' metrics measured' : 'all ' + p.total + ' metrics measured', g);
    status.className = 'gauge-status' + (p.partial ? ' flag' : ''); status.setAttribute('data-testid', 'gauge-status');
    g.onclick = () => { selected = i; tab = 'Metrics'; picked = null; render(); };
  });
  const p = data.pillars[selected];
  el('h2', p.name, details);
  const names = ['Metrics', 'Worst tests', 'Smells', ...(p.key === 'economy' ? ['Overlaps', 'Map'] : [])];
  const tabs = el('div', '', details); tabs.className = 'tabs';
  names.forEach((n) => { const b = el('button', n, tabs); b.setAttribute('aria-pressed', n === tab); b.onclick = () => { tab = n; picked = null; render(); }; });
  el('h3', tab, details);
  if (tab === 'Metrics') {
    if (!p.metrics.length) el('p', 'No metrics were measured for this pillar.', details);
    const t = el('table', '', details);
    const head = el('tr', '', t);
    ['Metric', 'Value', 'Score', 'Anchors'].forEach((h) => el('th', h, head));
    p.metrics.forEach((m) => {
      const u = m.unit || '', up = m.target < m.bad;
      const r = el('tr', '', t);
      el('td', m.name, r); el('td', nb(fmt(m.value), u), r); el('td', String(shown(m.score)), r);
      el('td', nb('target', up ? '≤' : '≥', fmt(m.target), u) + ', ' + nb('bad', up ? '≥' : '≤', fmt(m.bad), u), r);
    });
    p.missing.forEach((m) => {
      const r = el('tr', '', t);
      // no value, so no score or anchors: the reason takes their place
      el('td', m.name, r); el('td', 'unmeasured: ' + (m.reason || 'unavailable (cause not recorded)'), r).colSpan = 3;
    });
    el('p', 'Scores are rounded and shown as 1 to 99, not 100 or 0. A metric at its target scores 90 and at its bad anchor 10; the logistic curve between them never reaches 0 or 100.', details);
    if (data.skipped.length) {
      el('h3', 'Skipped tests', details);
      data.skipped.forEach((n) => testLine('p', n, details, '(skipped)'));
    }
    if (p.key === 'economy' && data.insufficient.length) {
      el('h3', 'Insufficient evidence (fewer than 2 sampled mutants on their lines)', details);
      data.insufficient.forEach((n) => testLine('p', n, details));
    }
  } else if (tab === 'Worst tests') {
    p.worst.forEach((w) => testLine('p', w.test, details, '(' + w.reason + ')').setAttribute('data-testid', 'worst-test'));
  } else if (tab === 'Smells') {
    const smells = Object.entries(p.smells);
    if (!smells.length) el('p', 'No test has a smell of this pillar.', details);
    smells.forEach(([smell, tests]) => {
      el('h4', smell + ' (' + tests.length + (tests.length === 1 ? ' test)' : ' tests)'), details).setAttribute('data-testid', 'smell');
      tests.forEach((n) => testLine('p', n, details).setAttribute('data-testid', 'smell-test'));
    });
  } else if (tab === 'Overlaps') {
    drawOverlaps(details);
  } else if (tab === 'Map') drawMap(details);
}
render();
</script></body></html>
