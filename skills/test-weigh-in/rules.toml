version = 1

[ruff]
# PT rules that are not style-only; each violation inside a test is a maintainability smell of it
pt = ["PT009", "PT010", "PT011", "PT012", "PT014", "PT015", "PT017", "PT018", "PT027", "PT029", "PT030", "PT031"]

[pillars.regression]
name = "Protection against regressions"

[pillars.regression.metrics.mutation_score]
name = "Mutation score"
weight = 0.45
target = 80
bad = 40

[pillars.regression.metrics.branch_coverage]
name = "Branch coverage"
weight = 0.25
target = 90
bad = 50
partial_weight = 0.6

[pillars.regression.metrics.hollow_tests]
name = "Hollow tests"
weight = 0.2
target = 0
bad = 10
partial_weight = 0.4

[pillars.regression.metrics.pseudo_tested_functions]
name = "Pseudo-tested functions"
weight = 0.1
target = 0
bad = 15

[pillars.refactoring]
name = "Resistance to refactoring"

[pillars.refactoring.metrics.brittle_test_files]
name = "Brittle test files"
weight = 0.4
target = 15
bad = 60

[pillars.refactoring.metrics.private_access]
name = "Tests with private access"
weight = 0.25
target = 2
bad = 30

[pillars.refactoring.metrics.mock_heavy]
name = "Mock-heavy tests"
weight = 0.2
target = 5
bad = 30

[pillars.refactoring.metrics.interaction_only]
name = "Interaction-only tests"
weight = 0.15
target = 5
bad = 30

[pillars.feedback]
name = "Fast feedback"

[pillars.feedback.metrics.total_runtime]
name = "Total runtime"
weight = 0.4
target = 60
bad = 600
log = true

[pillars.feedback.metrics.p95_duration]
name = "p95 test duration"
weight = 0.3
target = 0.1
bad = 2
log = true

[pillars.feedback.metrics.slowest_decile_share]
name = "Runtime share of slowest 10% of tests"
weight = 0.15
target = 40
bad = 90

[pillars.feedback.metrics.tests_over_10s]
name = "Tests over 10 s"
weight = 0.15
target = 0
bad = 2

[pillars.maintainability]
name = "Maintainability"

[pillars.maintainability.metrics.smelly_tests]
name = "Tests with a maintainability smell"
weight = 0.5
target = 5
bad = 40

[pillars.maintainability.metrics.long_tests]
name = "Tests longer than 50 lines"
weight = 0.2
target = 2
bad = 20

[pillars.maintainability.metrics.test_source_ratio]
name = "Test : source lines-of-code ratio"
weight = 0.3
target = 1.5
bad = 4.0

[pillars.economy]
name = "Economy"

[pillars.economy.metrics.no_unique_coverage]
name = "Tests with no unique coverage"
weight = 0.35
target = 10
bad = 50
partial_weight = 0.6

[pillars.economy.metrics.subsumed_in_kill_matrix]
name = "Tests subsumed in the kill matrix"
weight = 0.4
target = 5
bad = 35

[pillars.economy.metrics.duplicate_clusters]
name = "Tests in a duplicate-body cluster"
weight = 0.25
target = 2
bad = 20
partial_weight = 0.4
