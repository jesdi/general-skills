# pr-visual-diff remote capture. Template of the pr-visual-diff skill
# (references/capture-workflow.yml): copy it to .github/workflows/pr-visual-diff.yml
# and replace every __PVD_*__ marker with the value of the discovery cache.
# For a package manager other than pnpm, change the setup and the two
# `pnpm` lines of the capture step.
#
# A session that cannot run a browser (the agent-ops box) dispatches it:
# it captures After on `head` and Before on `base` with the capture spec the
# session filled, then pushes the PNGs as one orphan commit to the hidden ref
# refs/pr-screenshots/<slug>/<capture>, never to a branch. workflow_dispatch
# runs only when this file is on the default branch.
#
# The specs are code from the session; only users who can dispatch a workflow
# (write access) can send them. Inputs reach the shell through env only. The
# capture job runs project code (install scripts, the app, the spec), so it has
# a read-only token and keeps no credentials; only the publish job, which runs
# no project code, can write the hidden ref.

name: pr-visual-diff
run-name: pr-visual-diff ${{ inputs.capture }}

on:
  workflow_dispatch:
    inputs:
      capture:
        description: 'Unique id of this capture; the last part of the hidden ref'
        required: true
      slug:
        description: 'The PR branch with / as -'
        required: true
      head:
        description: 'Commit captured as After'
        required: true
      base:
        description: 'Commit captured as Before (the merge base)'
        required: true
      after_spec:
        description: 'The filled capture spec, base64'
        required: true
      before_spec:
        description: 'The filled capture spec of the views that exist at base, base64; empty: no Before'
        required: false
        default: ''
      projects:
        description: 'Playwright projects, separated by commas'
        required: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: __PVD_RUNNER__
    timeout-minutes: 30
    env:
      CAPTURE: ${{ inputs.capture }}
      SLUG: ${{ inputs.slug }}
      AFTER_SPEC: ${{ inputs.after_spec }}
      BEFORE_SPEC: ${{ inputs.before_spec }}
      PROJECTS: ${{ inputs.projects }}
    steps:
      - name: Check the names
        run: |
          set -euo pipefail
          for value in "$CAPTURE" "$SLUG"; do
            [[ "$value" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::'$value' is not a ref-safe name"; exit 1; }
          done

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
          path: head
          persist-credentials: false

      - uses: actions/checkout@v4
        if: inputs.before_spec != ''
        with:
          ref: ${{ inputs.base }}
          path: base
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: __PVD_PNPM_VERSION__

      - uses: actions/setup-node@v4
        with:
          node-version: '__PVD_NODE_VERSION__'

      - name: Capture
        run: |
          set -euo pipefail
          shots="$RUNNER_TEMP/shots"
          mkdir -p "$shots"
          args=()
          IFS=, read -ra names <<< "$PROJECTS"
          for name in "${names[@]}"; do args+=("--project=$name"); done
          capture() {  # <checkout> <label> <base64 spec>
            cd "$GITHUB_WORKSPACE/$1/__PVD_FRONTEND_DIR__"
            pnpm install --frozen-lockfile
            pnpm exec playwright install __PVD_BROWSERS__
            printf '%s' "$3" | base64 -d > "__PVD_SPECS_DIR__/__pr-capture__.spec.ts"
            PR_SHOT_DIR="$shots" PR_SHOT_LABEL="$2" \
              pnpm exec playwright test "__PVD_SPECS_DIR__/__pr-capture__.spec.ts" "${args[@]}"
          }
          capture head after "$AFTER_SPEC"
          if [ -n "$BEFORE_SPEC" ]; then capture base before "$BEFORE_SPEC"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: pr-visual-diff-shots
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pr-visual-diff-report
          path: |
            head/__PVD_FRONTEND_DIR__/playwright-report/
            head/__PVD_FRONTEND_DIR__/test-results/
            base/__PVD_FRONTEND_DIR__/playwright-report/
            base/__PVD_FRONTEND_DIR__/test-results/
          retention-days: 3
          if-no-files-found: ignore

  publish:
    needs: capture
    runs-on: __PVD_RUNNER__
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CAPTURE: ${{ inputs.capture }}
      SLUG: ${{ inputs.slug }}
    steps:
      # Only the git directory: this job runs no project code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
          sparse-checkout: .github
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: pr-visual-diff-shots
          path: ${{ runner.temp }}/shots

      - name: Push the screenshots to the hidden ref
        run: |
          set -euo pipefail
          tree=$(for f in "$RUNNER_TEMP"/shots/*.png; do
            printf '100644 blob %s\t%s\n' "$(git hash-object -w "$f")" "$(basename "$f")"
          done | git mktree)
          sha=$(git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit-tree "$tree" -m "pr-screenshots: ${SLUG} ${CAPTURE}")
          git push origin "${sha}:refs/pr-screenshots/${SLUG}/${CAPTURE}"
          echo "Screenshots: \`refs/pr-screenshots/${SLUG}/${CAPTURE}\` at ${sha}" >> "$GITHUB_STEP_SUMMARY"
