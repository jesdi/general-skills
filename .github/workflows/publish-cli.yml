name: publish-cli

on:
  push:
    branches: [main]
    paths: ['cli/src/**', 'cli/package.json']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @jesdi/skills-cli build
      - name: Bump if this version is published, then publish
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if pnpm view "@jesdi/skills-cli@$VERSION" version >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            pnpm version patch --no-git-tag-version
            git add package.json
            git commit -m "chore: release skills-cli [skip ci]"
            git pull --rebase origin main
            git push
          fi
          pnpm publish --provenance --access public --no-git-checks
