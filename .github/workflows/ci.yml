name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check --base "$CRAP_GATE_BASE"
        env:
          CRAP_GATE_BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha || 'origin/main' }}
          CRAP_GATE_CACHE_DIR: ${{ runner.temp }}/crap-gate-runtime
          CRAP_GATE_TEST_CACHE: ${{ runner.temp }}/crap-gate-runtime
